name: Apply GV80 hero safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-supabase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only hero image and cache
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'src="assets/hero.svg" alt="프리미엄 아파트 방문세차 이미지"'
          new = 'src="assets/gv80-main.png.png" alt="GV80 프리미엄 아파트 방문세차 이미지"'
          if old not in text:
              raise SystemExit('Expected hero markup not found; refusing broad edit')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace("const CACHE = 'athome-carcare-v6';", "const CACHE = 'athome-carcare-v7';")
          s = s.replace("const CACHE = 'athome-carcare-v5';", "const CACHE = 'athome-carcare-v7';")
          s = s.replace("'./icons/icon.svg', './assets/hero.svg',", "'./icons/icon.svg', './assets/gv80-main.png.png',")
          sw.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "Nothing to patch"
          else
            git commit -m "Use uploaded GV80 image for home hero"
            git push
          fi
