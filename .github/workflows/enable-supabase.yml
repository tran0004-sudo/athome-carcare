name: Refresh GV80 hero safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-supabase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only hero cache-buster and service worker
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'src="assets/gv80-main.png.png" alt="GV80 프리미엄 아파트 방문세차 이미지"'
          new = 'src="assets/gv80-main.png.png?v=20260915-1" alt="GV80 프리미엄 아파트 방문세차 이미지"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected GV80 hero markup not found; refusing broad edit')
          p.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          s = sw.read_text(encoding='utf-8')
          for v in ('v5','v6','v7'):
              s = s.replace(f"const CACHE = 'athome-carcare-{v}';", "const CACHE = 'athome-carcare-v8';")
          s = s.replace("'./icons/icon.svg', './assets/gv80-main.png.png',", "'./icons/icon.svg', './assets/gv80-main.png.png?v=20260915-1',")
          sw.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if git diff --cached --quiet; then
            echo "Nothing to patch"
          else
            git commit -m "Force refresh GV80 home hero"
            git push
          fi
