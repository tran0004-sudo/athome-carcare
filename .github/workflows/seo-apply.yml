name: Apply SEO basics

on:
  push:
    paths:
      - '.github/workflows/seo-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q pillow

      - name: Apply SEO changes
        shell: bash
        run: |
          python - <<'PY'
          import re, glob, os
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          U = 'https://tran0004-sudo.github.io/athome-carcare/'
          p = Path('index.html'); s = p.read_text(encoding='utf-8')
          if 'og:image' not in s:
              s = re.sub(r'  <meta name="description" content="[^"]*" />\n', f'''  <meta name="description" content="대구 전지역·경산 중산지구 아파트 출장세차. 주차만 해두면 집앞으로 찾아가는 방문세차, 출장비 무료. 외부세차 2.5만원부터, 월세차·실내세차 가능. 카카오채널·온라인 예약." />
            <link rel="canonical" href="{U}" />
            <meta name="robots" content="index,follow" />
            <!-- 검색엔진 소유확인: 받은 코드로 content 값을 채우고 주석을 풀어 주세요 -->
            <!-- <meta name="google-site-verification" content="구글_코드" /> -->
            <!-- <meta name="naver-site-verification" content="네이버_코드" /> -->
            <meta property="og:type" content="website" />
            <meta property="og:site_name" content="집앞세차 앳홈카케어" />
            <meta property="og:locale" content="ko_KR" />
            <meta property="og:title" content="대구 출장세차 · 방문세차 | 집앞세차 앳홈카케어" />
            <meta property="og:description" content="주차만 해두면 집앞으로 찾아가는 방문세차. 대구 전지역·경산 중산지구, 출장비 무료, 외부세차 2.5만원부터." />
            <meta property="og:url" content="{U}" />
            <meta property="og:image" content="{U}assets/og-image.jpg" />
            <meta property="og:image:width" content="1200" />
            <meta property="og:image:height" content="630" />
            <meta name="twitter:card" content="summary_large_image" />
          ''', s, count=1)
              s = re.sub(r'<title>[^<]*</title>', '''<title>대구 출장세차 · 방문세차 | 집앞세차 앳홈카케어</title>
            <script type="application/ld+json">
            {"@context":"https://schema.org","@type":"AutoWash","name":"집앞세차 앳홈카케어","alternateName":["앳홈카케어","At Home Car Care"],
             "url":"U_","image":"U_assets/og-image.jpg","logo":"U_icons/icon-512.png",
             "description":"대구 전지역·경산 중산지구 아파트 출장세차(방문세차). 출장비 무료, 외부세차·외부+내부세차·월세차.",
             "priceRange":"₩25,000~","currenciesAccepted":"KRW",
             "address":{"@type":"PostalAddress","addressLocality":"대구광역시","addressCountry":"KR"},
             "areaServed":[{"@type":"City","name":"대구광역시"},{"@type":"Place","name":"경산시 중산지구"}],
             "sameAs":["https://pf.kakao.com/_gpDrX"]}
            </script>'''.replace('U_', U), s, count=1)
              s = re.sub(r'(<div class="page-title"><span>[^<]*</span>)<h1>(.*?)</h1>', r'\1<h2>\2</h2>', s)
              s = s.replace('<br>프리미엄 방문세차</h1>', '<br>프리미엄 방문세차<span class="sr-only"> · 대구 출장세차 앳홈카케어</span></h1>')
              s = s.replace('</style>\n</head>', '.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\n</style>\n</head>', 1)
              s = re.sub(r'styles\.css\?v=[^"]*', 'styles.css?v=20260929-seo', s)
              s = re.sub(r'app\.js\?v=[^"]*', 'app.js?v=20260929-seo', s)
              p.write_text(s, encoding='utf-8')

          c = Path('styles.css'); t = c.read_text(encoding='utf-8')
          if '.page-title h2' not in t:
              t = t.replace('.page-title h1{', '.page-title h1,.page-title h2{')
              c.write_text(t, encoding='utf-8')

          a = Path('app.js'); t = a.read_text(encoding='utf-8')
          t = t.replace('<img class="blog-thumb" src="${esc2(p.thumb)}" alt=""', '<img class="blog-thumb" src="${esc2(p.thumb)}" alt="${esc2(p.title || \'출장세차 작업 일지\')} 사진"')
          a.write_text(t, encoding='utf-8')

          w = Path('service-worker.js'); t = w.read_text(encoding='utf-8')
          if 'app.js?v=20260929-seo' not in t:
              t = re.sub(r"athome-carcare-v(\d+)", lambda m: f"athome-carcare-v{int(m.group(1))+1}", t, count=1)
              t = re.sub(r"\./app\.js\?v=[^']*", './app.js?v=20260929-seo', t)
              w.write_text(t, encoding='utf-8')

          Path('robots.txt').write_text(f"User-agent: *\nAllow: /\n\nSitemap: {U}sitemap.xml\n", encoding='utf-8')
          Path('sitemap.xml').write_text(f'''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>{U}</loc><lastmod>2026-09-29</lastmod><changefreq>weekly</changefreq><priority>1.0</priority></url>
            <url><loc>{U}partner-recruit.html</loc><lastmod>2026-09-29</lastmod><changefreq>monthly</changefreq><priority>0.5</priority></url>
          </urlset>
          ''', encoding='utf-8')

          for f in glob.glob('assets/before-after/*.jpg'):
              if os.path.getsize(f) < 250_000: continue
              im = ImageOps.exif_transpose(Image.open(f)).convert('RGB'); im.thumbnail((1280, 1280))
              im.save(f, 'JPEG', quality=78, optimize=True, progressive=True)

          if not os.path.exists('assets/og-image.jpg'):
              W, H = 1200, 630
              bg = Image.new('RGB', (W, H), '#087C68'); d = ImageDraw.Draw(bg)
              ph = Image.open('assets/before-after/tucson-front-after.jpg').convert('RGB'); pw = 520
              r = ph.resize((pw, int(ph.height * pw / ph.width)))
              r = r.crop((0, (r.height - H) // 2, pw, (r.height - H) // 2 + H)) if r.height >= H else ph.resize((pw, H))
              bg.paste(r, (W - pw, 0)); d.polygon([(W-pw-1, 0), (W-pw+70, 0), (W-pw-1, H)], fill='#087C68')
              logo = Image.open('icons/icon-512.png').convert('RGBA').resize((120, 120)); bg.paste(logo, (64, 60), logo)
              fb = glob.glob('/usr/share/fonts/**/NotoSansCJK-Black.ttc', recursive=True)[0]
              fd = glob.glob('/usr/share/fonts/**/NotoSansCJK-Bold.ttc', recursive=True)[0]
              F = lambda path, n: ImageFont.truetype(path, n, index=1)
              d.text((64, 215), "대구 출장세차", font=F(fb, 76), fill='white')
              d.text((64, 305), "집앞세차 앳홈카케어", font=F(fb, 76), fill='#bff3e3')
              d.text((64, 420), "주차만 해두면 끝 · 출장비 무료", font=F(fd, 36), fill='white')
              d.text((64, 478), "대구 전지역 · 경산 중산지구", font=F(fd, 30), fill='#d8f5ec')
              bg.save('assets/og-image.jpg', 'JPEG', quality=85, optimize=True, progressive=True)
          print('SEO applied')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html styles.css app.js service-worker.js robots.txt sitemap.xml assets
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "SEO 기본 적용: 타이틀·메타·OG·구조화데이터·H1·사이트맵·이미지 압축"
            git pull --rebase
            git push
          fi
