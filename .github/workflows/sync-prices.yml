name: 요금·오프라인 목록·sitemap 동기화

# prices.js(요금 원본)를 고치면 index.html·price.html의 기본 글자를 자동으로 맞추고,
# index.html이 부르는 파일 버전에 맞춰 service-worker.js 미리 저장 목록도 맞추고,
# 각 페이지가 바뀐 날짜로 sitemap.xml의 lastmod를 갱신합니다.
on:
  push:
    branches: [main]
    paths:
      - 'prices.js'
      - 'index.html'
      - 'price.html'
      - 'scripts/sync-prices.js'
      - 'scripts/sync-sw.js'
      - 'service-worker.js'
      - 'privacy.html'
      - 'partner-recruit.html'
      - 'sitemap.xml'
      - 'scripts/sync-sitemap.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 페이지별 마지막 수정일을 읽기 위해 전체 기록
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: prices.js 값으로 HTML 맞추기
        run: node scripts/sync-prices.js
      - name: 서비스워커 미리 저장 목록 맞추기
        run: node scripts/sync-sw.js
      - name: sitemap 날짜 맞추기
        run: node scripts/sync-sitemap.js
      - name: 변경 사항 커밋
        run: |
          if git diff --quiet -- index.html price.html service-worker.js sitemap.xml; then
            echo "모두 일치 — 바꿀 곳 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html price.html service-worker.js sitemap.xml
          git commit -m "요금·서비스워커 목록·sitemap 동기화"
          git push
