name: Polish home layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-home-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force-load clean hero stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'home-polish\.css\?v=[^"\']+', 'home-polish.css?v=20260915-5', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Force load clean non-duplicated mobile hero"
            git push
          fi
