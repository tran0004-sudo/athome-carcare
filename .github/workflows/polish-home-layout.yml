name: Refresh app icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-home-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force-load 집앞세차 icon and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'manifest\.webmanifest(?:\?v=[^"\']+)?', 'manifest.webmanifest?v=20260915-7', s)
          s = re.sub(r'icons/icon\.svg(?:\?v=[^"\']+)?', 'icons/icon.svg?v=20260915-7', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit icon refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Force load 집앞세차 app icon"
            git push
          fi
