name: Apply live app hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch live index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('manifest.webmanifest?v=20260915-7', 'manifest.webmanifest?v=20260916-icon1')
          s = s.replace('icons/icon.svg?v=20260915-7', 'icons/icon-192.png?v=20260916-icon1')
          s = s.replace('assets/gv80-hero.webp?v=20260916-2', 'assets/gv80-hero.jpg?v=20260916-3')
          if 'compat-fix.js' not in s:
              s = s.replace(
                  '  <script src="restore-classic.js',
                  '  <script src="compat-fix.js?v=20260916-3"></script>\n  <script src="restore-classic.js',
                  1,
              )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit live hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Apply live homepage compatibility fix"
            git push
          fi
