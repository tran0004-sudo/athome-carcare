name: Upload before after assets

on:
  push:
    paths:
      - '.github/workflows/upload-before-after.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode before-after images
        shell: python
        run: |
          from pathlib import Path
          import base64, json
          out = Path('assets/before-after')
          stems = ['wheel-before','wheel-after','front-before','front-after','mat-before','mat-after']
          for stem in stems:
              raw = (out / f'{stem}.b64').read_text(encoding='utf-8').strip()
              (out / f'{stem}.jpg').write_bytes(base64.b64decode(raw, validate=True))

          p = Path('data/content.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['gallery'] = [
            {'id':'g1','title':'휠 세척 전후','note':'실제 세차 전 사진과 AI 생성 세차 후 예시 비교','before':'assets/before-after/wheel-before.jpg','after':'assets/before-after/wheel-after.jpg'},
            {'id':'g2','title':'차량 외부 세차 전후','note':'번호판 모자이크 처리 · 실제 세차 전 사진과 AI 생성 세차 후 예시 비교','before':'assets/before-after/front-before.jpg','after':'assets/before-after/front-after.jpg'},
            {'id':'g3','title':'실내 매트 세차 전후','note':'실제 운전석 매트 세차 전 사진과 AI 생성 세차 후 예시 비교','before':'assets/before-after/mat-before.jpg','after':'assets/before-after/mat-after.jpg'}
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm assets/before-after/*.b64
          git add assets/before-after data/content.json
          git commit -m "Add real before and AI after wash photos"
          git push

# trigger v3
