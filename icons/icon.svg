    <circle cx="56" cy="216" r="28" fill="#f5fffc"/>
    <circle cx="56" cy="216" r="14" fill="#0b2d29"/>
    <circle cx="252" cy="216" r="28" fill="#f5fffc"/>
    <circle cx="252" cy="216" r="14" fill="#0b2d29"/>
  </g>

