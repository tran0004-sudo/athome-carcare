  <text x="256" y="439" text-anchor="middle" font-size="48" font-weight="900" letter-spacing="-2" font-family="Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#087c68">집앞세차</text>
